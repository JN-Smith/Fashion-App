  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <main class="min-h-[884px] w-full max-w-[390px] mx-auto px-page-margin py-gutter-lg flex flex-col justify-between gap-gutter-xl" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div class="flex flex-col gap-gutter-xl">
      <!-- Top Bar -->
      <header class="flex items-center justify-between">
        <a href="../splash-welcome/SplashWelcome.html" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" aria-label="Back to welcome" class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-light-surface-container-low text-light-on-surface border border-light-outline-variant">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
        </a>
        <span data-design-text-token="headline-md" class="font-display text-headline-md tracking-widest text-light-primary">SIFA</span>
        <span class="w-11" aria-hidden="true"></span>
      </header>

      <!-- Editorial Intro -->
      <section class="flex flex-col gap-gutter-xs">
        <span data-design-text-token="label-sm" class="font-label text-label-sm uppercase tracking-widest text-light-secondary">Member Access</span>
        <h1 data-design-text-token="headline-lg-mobile" class="font-headline text-headline-lg-mobile text-light-on-surface">Welcome Back</h1>
        <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant">Sign in to access your saved measurements, wishlist, and Nairobi delivery addresses.</p>
      </section>

      <!-- Sign In Form -->
      <form action="../home-discover/HomeDiscover.html" class="flex flex-col gap-gutter-md">
        <!-- COMPONENT: input-field-icon -->
        <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-gutter-xs w-full">
          <span data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface">Email address</span>
          <div class="relative flex items-center">
            <span aria-hidden="true" class="material-symbols-outlined text-[18px] text-light-outline absolute left-3.5 pointer-events-none">mail</span>
            <input type="email" inputmode="email" value="amara.wanjiku@atelier.ke" placeholder="you@example.com" class="w-full pl-10 pr-gutter-md py-3 rounded-md bg-light-surface-container-lowest border border-light-outline-variant text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </div>
        </label>

        <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="password" class="flex flex-col gap-gutter-xs w-full">
          <div class="flex items-center justify-between">
            <span data-design-text-token="label-lg" class="font-label text-label-lg text-light-on-surface">Password</span>
            <a href="#forgot" data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary underline underline-offset-4">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <span aria-hidden="true" class="material-symbols-outlined text-[18px] text-light-outline absolute left-3.5 pointer-events-none">lock</span>
            <input id="signin-password" type="password" value="••••••••••••" autocomplete="current-password" class="w-full pl-10 pr-11 py-3 rounded-md bg-light-surface-container-lowest border border-light-outline-variant text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <button type="button" onclick="togglePass()" aria-label="Toggle password visibility" class="absolute right-3 text-light-outline hover:text-light-on-surface">
              <span id="eye-icon" class="material-symbols-outlined text-[20px]">visibility</span>
            </button>
          </div>
        </label>

        <!-- COMPONENT: button-primary -->
        <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full mt-gutter-sm inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg transition-colors duration-state-change ease-state-change hover:bg-light-primary-container active:scale-95">
          <span data-design-text-token="label-lg">Sign In</span>
        </button>

        <div class="flex items-center gap-gutter-md my-gutter-xs">
          <div class="flex-1 h-px bg-light-outline-variant"></div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant uppercase">or continue with</span>
          <div class="flex-1 h-px bg-light-outline-variant"></div>
        </div>

        <div class="grid grid-cols-2 gap-gutter-sm">
          <a href="../home-discover/HomeDiscover.html" class="inline-flex items-center justify-center gap-gutter-xs py-3 px-gutter-md rounded-full border border-light-outline-variant bg-light-surface-container-lowest text-light-on-surface font-label text-label-lg">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">passkey</span>
            <span data-design-text-token="label-lg">Google</span>
          </a>
          <a href="../home-discover/HomeDiscover.html" class="inline-flex items-center justify-center gap-gutter-xs py-3 px-gutter-md rounded-full border border-light-outline-variant bg-light-surface-container-lowest text-light-on-surface font-label text-label-lg">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">phone_iphone</span>
            <span data-design-text-token="label-lg">Apple</span>
          </a>
        </div>
      </form>
    </div>

    <footer class="text-center pb-gutter-sm">
      <p data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant">
        New to SIFA? <a href="../sign-up/SignUp.html" class="font-label text-label-lg text-light-primary underline underline-offset-4">Create an account</a>
      </p>
    </footer>
  </main>
  <script>
    function togglePass() {
      const inp = document.getElementById('signin-password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') { inp.type = 'text'; icon.textContent = 'visibility_off'; }
      else { inp.type = 'password'; icon.textContent = 'visibility'; }
    }
  </script>


</body></html>
