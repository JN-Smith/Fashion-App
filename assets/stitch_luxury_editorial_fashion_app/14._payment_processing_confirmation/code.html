  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <main class="min-h-[884px] w-full max-w-[390px] mx-auto px-page-margin py-gutter-lg flex flex-col justify-between gap-gutter-lg" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Top Brand -->
    <header class="flex items-center justify-between">
      <a href="../checkout-payment/CheckoutPayment.html" aria-label="Back to payment methods" class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-light-surface-container-low border border-light-outline-variant text-light-on-surface">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </a>
      <span data-design-text-token="mono-md" class="font-mono text-mono-md text-light-on-surface-variant tabular-nums">Ref: SIFA-8492</span>
      <span class="w-11" aria-hidden="true"></span>
    </header>

    <!-- Center Payment Status View -->
    <section class="flex flex-col items-center text-center gap-gutter-md my-auto">
      <div id="status-badge" class="w-20 h-20 rounded-full bg-warning/15 text-warning flex items-center justify-center">
        <span id="status-icon" class="material-symbols-outlined text-[36px]" aria-hidden="true">phonelink_ring</span>
      </div>

      <div class="flex flex-col gap-gutter-xs">
        <span id="status-eyebrow" data-design-text-token="label-sm" class="font-label text-label-sm uppercase tracking-widest text-warning">M-Pesa STK Push Sent</span>
        <h1 id="status-title" data-design-text-token="headline-lg-mobile" class="font-headline text-headline-lg-mobile text-light-on-surface">Approve on Your Phone</h1>
        <p id="status-desc" data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant text-pretty max-w-prose">
          Check your Safaricom line <span class="font-mono text-light-on-surface">254712345678</span> and enter your M-Pesa PIN to authorize <span class="font-mono text-light-primary">KES 14,950</span>.
        </p>
      </div>

      <!-- Order Summary Pill -->
      <div class="w-full rounded-xl bg-light-surface-container-low border border-light-outline-variant p-gutter-md flex items-center justify-between">
        <span data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant">Payment Status</span>
        <span id="status-pill" data-design-text-token="label-sm" class="px-3 py-1 rounded-full bg-warning text-on-warning font-label text-label-sm uppercase">Pending</span>
      </div>

      <!-- State Preview Controls (for testing pending/paid/failed) -->
      <div class="flex items-center gap-gutter-xs pt-gutter-sm">
        <button type="button" onclick="setStatus(&#39;pending&#39;)" class="px-3 py-1.5 rounded-full border border-light-outline-variant text-label-sm font-label">Waiting</button>
        <button type="button" onclick="setStatus(&#39;paid&#39;)" class="px-3 py-1.5 rounded-full border border-success text-success text-label-sm font-label">Simulate Paid</button>
        <button type="button" onclick="setStatus(&#39;failed&#39;)" class="px-3 py-1.5 rounded-full border border-light-error text-light-error text-label-sm font-label">Simulate Failed</button>
      </div>
    </section>

    <!-- Bottom Action -->
    <footer class="flex flex-col gap-gutter-sm">
      <a id="primary-action" href="../order-success/OrderSuccess.html" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg">
        <span data-design-text-token="label-lg">Confirm &amp; View Order</span>
      </a>
      <a href="../checkout-payment/CheckoutPayment.html" data-design-text-token="label-lg" class="text-center py-2 font-label text-label-lg text-light-on-surface-variant underline underline-offset-4">
        Use another payment method
      </a>
    </footer>
  </main>

  <script>
    function setStatus(state) {
      const badge = document.getElementById('status-badge');
      const icon = document.getElementById('status-icon');
      const eyebrow = document.getElementById('status-eyebrow');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');
      const pill = document.getElementById('status-pill');
      const cta = document.getElementById('primary-action');

      if (state === 'pending') {
        badge.className = 'w-20 h-20 rounded-full bg-warning/15 text-warning flex items-center justify-center';
        icon.textContent = 'phonelink_ring';
        eyebrow.className = 'font-label text-label-sm uppercase tracking-widest text-warning';
        eyebrow.textContent = 'M-Pesa STK Push Sent';
        title.textContent = 'Approve on Your Phone';
        desc.textContent = 'Check your Safaricom line 254712345678 and enter your M-Pesa PIN to authorize KES 14,950.';
        pill.className = 'px-3 py-1 rounded-full bg-warning text-on-warning font-label text-label-sm uppercase';
        pill.textContent = 'Pending';
        cta.querySelector('span').textContent = 'Confirm & View Order';
      } else if (state === 'paid') {
        badge.className = 'w-20 h-20 rounded-full bg-success/15 text-success flex items-center justify-center';
        icon.textContent = 'check_circle';
        eyebrow.className = 'font-label text-label-sm uppercase tracking-widest text-success';
        eyebrow.textContent = 'M-Pesa Receipt SLK94M2X8Q';
        title.textContent = 'Payment Confirmed';
        desc.textContent = 'KES 14,950 received. Preparing your Crimson Silk Wrap Dress for Nairobi delivery.';
        pill.className = 'px-3 py-1 rounded-full bg-success text-on-success font-label text-label-sm uppercase';
        pill.textContent = 'Paid';
        cta.querySelector('span').textContent = 'View Order Success';
      } else {
        badge.className = 'w-20 h-20 rounded-full bg-light-error-container text-light-error flex items-center justify-center';
        icon.textContent = 'error';
        eyebrow.className = 'font-label text-label-sm uppercase tracking-widest text-light-error';
        eyebrow.textContent = 'Request Cancelled or Timed Out';
        title.textContent = 'Payment Not Completed';
        desc.textContent = 'No funds were deducted. Check your M-Pesa balance or try another payment method.';
        pill.className = 'px-3 py-1 rounded-full bg-light-error text-light-on-error font-label text-label-sm uppercase';
        pill.textContent = 'Failed';
        cta.querySelector('span').textContent = 'Try Again';
      }
    }
  </script>


</body></html>
