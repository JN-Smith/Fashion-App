  <style>.material-symbols-outlined { display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle; }</style>

<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[884px] w-full max-w-[390px] mx-auto px-page-margin py-gutter-lg flex flex-col justify-between gap-gutter-lg" data-stitch-vh="min-h-[884px]===min-h-screen">
    <div class="flex flex-col gap-gutter-lg">
      <!-- Header -->
      <header class="flex items-center justify-between">
        <a href="../checkout-delivery/CheckoutDelivery.html" data-component-id="button-icon" data-component-type="button" data-component-variant="icon" aria-label="Back to delivery" class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-light-surface-container-low text-light-on-surface border border-light-outline-variant">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
        </a>
        <h1 data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface">Payment Method</h1>
        <span class="w-11" aria-hidden="true"></span>
      </header>

      <!-- Stepper -->
      <div class="grid grid-cols-3 gap-gutter-xs items-center">
        <div class="flex flex-col gap-1">
          <div class="h-1 rounded-full bg-light-primary"></div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">1. Delivery</span>
        </div>
        <div class="flex flex-col gap-1">
          <div class="h-1 rounded-full bg-light-primary"></div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-primary">2. Payment</span>
        </div>
        <div class="flex flex-col gap-1">
          <div class="h-1 rounded-full bg-light-outline-variant"></div>
          <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">3. Confirm</span>
        </div>
      </div>

      <!-- Payment Method Picker -->
      <section class="flex flex-col gap-gutter-sm">
        <!-- M-Pesa (Active) -->
        <div id="card-mpesa" class="pay-card rounded-xl border-2 border-light-primary bg-light-surface-container-low p-gutter-md flex flex-col gap-gutter-md">
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-gutter-sm">
              <input type="radio" name="method" value="mpesa" checked onchange="selectMethod(&#39;mpesa&#39;)" class="text-light-primary focus:ring-light-primary">
              <div class="flex flex-col">
                <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">M-Pesa (STK Push)</span>
                <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">Instant prompt on your Safaricom line</span>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-md bg-success text-on-success font-label text-label-sm">M-PESA</span>
          </label>
          <div id="panel-mpesa" class="pay-panel flex flex-col gap-gutter-xs">
            <label class="flex flex-col gap-gutter-xs">
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface">M-Pesa Phone Number</span>
              <input type="tel" inputmode="numeric" value="254712345678" placeholder="2547XXXXXXXX" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container-lowest border border-light-outline-variant font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
          </div>
        </div>

        <!-- Airtel Money -->
        <div id="card-airtel" class="pay-card rounded-xl border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex flex-col gap-gutter-md">
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-gutter-sm">
              <input type="radio" name="method" value="airtel" onchange="selectMethod(&#39;airtel&#39;)" class="text-light-primary focus:ring-light-primary">
              <div class="flex flex-col">
                <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">Airtel Money</span>
                <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">Approve collection request on your phone</span>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-md bg-light-error text-light-on-error font-label text-label-sm">AIRTEL</span>
          </label>
          <div id="panel-airtel" class="pay-panel hidden flex-col gap-gutter-xs">
            <label class="flex flex-col gap-gutter-xs">
              <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface">Airtel Money Number</span>
              <input type="tel" inputmode="numeric" value="254733987654" placeholder="2547XXXXXXXX" class="w-full px-gutter-md py-2.5 rounded-md bg-light-surface-container-lowest border border-light-outline-variant font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            </label>
          </div>
        </div>

        <!-- Bank Transfer -->
        <div id="card-bank" class="pay-card rounded-xl border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex flex-col gap-gutter-md">
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-gutter-sm">
              <input type="radio" name="method" value="bank" onchange="selectMethod(&#39;bank&#39;)" class="text-light-primary focus:ring-light-primary">
              <div class="flex flex-col">
                <span data-design-text-token="title-md" class="font-title text-title-md text-light-on-surface">Bank Transfer</span>
                <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant">PesaLink or RTGS · Order stays pending until settled</span>
              </div>
            </div>
            <span class="material-symbols-outlined text-[20px] text-light-on-surface-variant" aria-hidden="true">account_balance</span>
          </label>
          <div id="panel-bank" class="pay-panel hidden flex-col gap-gutter-xs rounded-lg bg-light-surface-container p-gutter-sm">
            <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface">Account: SIFA Atelier Ltd · KCB Kilimani</span>
            <span data-design-text-token="mono-md" class="font-mono text-mono-md text-light-primary tabular-nums">Acc: 1290 4481 90 · Ref: SIFA-8492</span>
          </div>
        </div>
      </section>
    </div>

    <!-- Bottom Summary & Pay CTA -->
    <footer class="flex flex-col gap-gutter-md">
      <div class="rounded-xl bg-light-surface-container-low border border-light-outline-variant p-gutter-md flex items-center justify-between">
        <span data-design-text-token="body-md" class="font-body text-body-md text-light-on-surface-variant">Amount Due</span>
        <span data-design-text-token="title-lg" class="font-mono text-title-lg text-light-primary tabular-nums">KES 14,950</span>
      </div>
      <a href="../payment-processing/PaymentProcessing.html" data-component-id="button-with-icon" data-component-type="button" data-component-variant="with-icon" class="w-full inline-flex items-center justify-center gap-gutter-sm px-gutter-lg py-3.5 rounded-full bg-light-primary text-light-on-primary font-label text-label-lg">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">lock</span>
        <span data-design-text-token="label-lg">Pay KES 14,950</span>
      </a>
    </footer>
  </div>

  <script>
    function selectMethod(method) {
      ['mpesa', 'airtel', 'bank'].forEach(m => {
        const card = document.getElementById('card-' + m);
        const panel = document.getElementById('panel-' + m);
        if (m === method) {
          card.className = 'pay-card rounded-xl border-2 border-light-primary bg-light-surface-container-low p-gutter-md flex flex-col gap-gutter-md';
          panel.classList.remove('hidden');
          panel.classList.add('flex');
        } else {
          card.className = 'pay-card rounded-xl border border-light-outline-variant bg-light-surface-container-lowest p-gutter-md flex flex-col gap-gutter-md';
          panel.classList.add('hidden');
          panel.classList.remove('flex');
        }
      });
    }
  </script>


</body></html>
